[project]
name = "l2cs"
version = "0.0.1"
description = "The official PyTorch implementation of L2CS-Net for gaze estimation and tracking"
authors = [{ name = "Ahmed Abderlrahman" }, { name = "Thorsten Hempel" }]
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.13,<3.15"

keywords = ["gaze", "estimation", "eye-tracking", "deep-learning", "pytorch"]

classifiers = ["Programming Language :: Python :: 3"]

dependencies = [
    'matplotlib>=3.3.4',
    'numpy>=2,<2.3.0',
    'opencv-python>=4.5.5',
    'pandas>=1.1.5',
    'Pillow>=8.4.0',
    'scipy>=1.5.4',
    'batch-face>=1.5.4',
]

[tool.poetry.group.amd.dependencies]
torch = { version = "^2.9", source = "pytorch-rocm" }
torchvision = { version = "^0.24", source = "pytorch-rocm" }

# [tool.poetry.group.nvidia.dependencies]
# torch = { version = "^2.9", source = "https://download.pytorch.org"}
# torchvision = { version = "^0.24", source = "https://download.pytorch.org" }

[project.urls]
homepath = "https://github.com/Ahmednull/L2CS-Net"
repository = "https://github.com/Ahmednull/L2CS-Net"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

# https://setuptools.pypa.io/en/stable/userguide/datafiles.html
[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]

[tool.poetry.group.dev.dependencies]
pre-commit = "^4.4.0"
flake8 = "^7.3.0"
isort = "^7.0.0"
black = "^25.9.0"

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
extend_skip = ["build", "dist", ".venv", ".tox", ".gitignore"]
no_sections = 'true'

[[tool.poetry.source]]
name = "PyPI"
priority = "primary"

[[tool.poetry.source]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
priority = "supplemental"